name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Go mod verify
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test (short, race)
        run: go test ./... -short -race -count=1 -timeout 15m
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Test (full, no race)
        run: go test ./... -count=1 -timeout 15m
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
